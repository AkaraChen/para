[package]
name = "para"
description = "PARA markdown preview: file tree, multi-tab readonly preview, and an agent chat."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
default-run = "para"

[dependencies]
anyhow = "1"
bezel = "0.1"
gpui = { package = "bezel-gpui", version = "0.3" }
gpui_platform = { package = "bezel-gpui-platform", version = "0.3", features = ["font-kit", "x11", "wayland"] }
markdown = { package = "bezel-markdown", version = "0.1" }
