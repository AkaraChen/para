name: generate-para-cli

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-para.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go generate ./
      - name: Commit generated CLI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/para/main.go
          git diff --cached --quiet || git commit -m "feat: add ctxl-generated para CLI"
          git push
