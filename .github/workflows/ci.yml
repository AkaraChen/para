name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify generated CLI is current
        run: |
          go generate ./...
          git diff --exit-code -- cmd/para
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Build
        run: go build -o /tmp/para ./cmd/para
